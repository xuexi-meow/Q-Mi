# ============================================================
# Q-Mi 配置示例（复制为 Config.yaml 后填 key）
#
# 热重载：运行中修改本文件会自动生效（模型/提示词/阈值/工具板块/轮询间隔）；
# 监听地址、存储路径、WebUI 端口、bot.qq_number 等改完需重启。
# WebUI 写入的配置单独存在 Config.webui.yaml（覆盖本文件，删除即恢复本文件的值）。
# ============================================================

bot:
  qq_number: 0            # 机器人自己的 QQ 号(agent 的 @检测与上下文都用它)
  admin_number:           # 管理员 QQ 列表：
    - 1234                #   · 危险工具/操作需要列表内的人发起
                          #   · 审批请求私聊发给第一个，回复「同意 <id>」/「拒绝 <id>」执行

netsetting:               # Q-Mi 监听侧：接收 NapCat/SnowLuma 的 HTTP 事件上报
  host: "0.0.0.0"         # 监听地址；WSL 上报走 Windows 宿主则填宿主网卡（vEthernet (WSL) 的 IP）
  port: 9090
  pattern: "/Q-Mi"        # 上报路径（与协议端 httpClients 的 url 一致）
  token: "填一个随机hex"   # 鉴权 token，需与协议端 httpClients 的 token 一致

napcat:                   # Q-Mi → 协议端（NapCat / SnowLuma）的调用通道
  ws:                     # WebSocket（当前未使用，可保持关闭）
    enable: false
    host: "127.0.0.1"
    port: 8080
    token: ""
  http:                   # HTTP 调用通道（主用）
    enable: true
    host: "172.25.x.x"    # 协议端地址：WSL 内用 wsl 里 ip addr show eth0 的地址
    port: 3000            # SnowLuma onebot httpServer 缺省 3000
    token: "填一个随机hex" # 与协议端 httpServers 的 accessToken 一致

storage:                  # 消息记忆库（SQLite，WAL）
  enable: true
  path: "Q-Mi.db"         # 关闭后 agent 无历史/查询工具，仅凭当前消息对话

agent:
  enable: false

  # ---- 模型接入 ----
  # 方式一（单模型）：顶层三件套，自动作为 chat 档
  base_url: "https://api.deepseek.com"   # OpenAI 兼容地址,含 /v1
  api_key: "sk-..."
  model: "deepseek-flash"                # deepseek-flash=DeepSeek 便宜的视觉档

  # 方式二（分档模型）：一个档位可以有多个候选，按顺序取第一个可用；
  # 候选可单独 enable:false 停用，配置保留不删。
  # models:
  #   chat:                              # 主对话（有人找它/它主动说话）
  #     enable: true                     # 整档停用 = 回退到 chat 的顶层三件套
  #     strategy: priority               # 目前只支持 priority（按列表顺序）
  #     candidates:
  #       - name: deepseek               # 日志/统计/事件里的标签，档内唯一
  #         enable: true
  #         base_url: "https://api.deepseek.com"
  #         api_key: "sk-..."            # 与 api_key_env 二选一
  #         model: "deepseek-flash"
  #         capabilities: [tools, vision]  # 不写 = 不限制；写了就按能力过滤
  #         context_window: 64000        # 仅用于预算参考
  #         cooldown: 5m                 # 失败后冷却，缺省 5m；"0" 关闭
  #       - name: zhipu
  #         enable: false                # 备用候选：先停用，随时打开
  #         base_url: "https://open.bigmodel.cn/api/paas/v4"
  #         api_key_env: ZHIPU_API_KEY   # 从环境变量读，避免明文
  #         model: "glm-4.6v-flash"
  #         capabilities: [tools, vision]
  #   background:                        # 后台唤醒（轮询/通知/定时/任务回执）
  #     candidates:
  #       - name: glm-flash
  #         base_url: "https://open.bigmodel.cn/api/paas/v4"
  #         api_key_env: ZHIPU_API_KEY
  #         model: "glm-4.6v-flash"
  #         capabilities: [tools, vision]
  #   video:                             # 含视频内容的 turn（尚未落地，可先停用）
  #     enable: false
  #     candidates: []
  #
  # 唤醒类型 → 档位：缺省 chat→chat、background→background。
  # 自定义档位必须在这里显式路由才会被用到。
  # wake_routes:
  #   background: background
  #
  # max_attempts: 2                      # 单次请求最多试几个候选（含首个），上限 5
  # tool_choice: required               # 仅在提供商支持时开启：强制实际 tool_calls，仍可 finish 不发言
  # 候选也可单独设置 tool_choice: auto 覆盖顶层；缺省不发送该参数，兼容旧接口。
  # 主循环使用原生 function calling + 参数 schema/本地校验，不把 content 的 JSON 当工具执行。
  # 不同时强制 response_format: json_object；它约束的是普通 content，不是工具参数。


  # ---- 提示词与行为 ----
  persona_file: "agent/persona.md"       # 人设（你的文件，AI 不动）；每次模型请求前热读取
  guide_file: "agent/guide.md"           # 行为/礼仪约束；修改后下一次请求生效，保存时短暂空文件保留上一版
  # 自学的真人聊天习惯由 AI 保存在 workspace_dir/chat_style.md（缺省 agent/workspace/chat_style.md）。
  # 每次模型请求前读取，最多注入 2000 字；笔记/情绪/习惯仅变化时追加快照，删除也生效。
  temperature: 0.8
  debounce: 3s                           # 空闲时账号级合并窗口；忙时在下次请求前插入，不取消当前请求
  self_wake: "10m"                       # 定时轮询间隔，"off" 关闭；轮询只是唤醒，发不发言模型自决
  max_tool_rounds: 180                   # 思考轮数上限（finish 提前终止）；长任务工作流保持大值
  multimodal: true                       # 图片多模态直送模型；模型不支持图片输入设 false（维持纯文本+CQ 码）

  # ---- 存储/缓存目录 ----
  # image_dir: "agent/images"            # 图片内容寻址缓存（sha256 落盘+消息锚定去重，超 2GB 自动清最旧）
  # workspace_dir: "agent/workspace"     # 电脑操作工作区（computer 板块的文件围栏根目录）
  # browser_executable: "C:/Program Files/Google/Chrome/Application/chrome.exe"  # 浏览器路径；缺省自动探测 Chrome/Edge

  # ---- 工具板块启停（重启生效；缺省键 = 启用，显式 false 不加载）----
  # modules:
  #   core: true        # 发消息/思考笔记/情绪/结束
  #   memory: true      # 查聊天记录/搜历史/看消息图片
  #   sticker: true     # 表情收藏
  #   qzone: true       # QQ 空间
  #   admin: true       # QQ 管理 + napcat 逃生舱
  #   computer: true    # 电脑操作（文件/下载/命令行，工作区围栏+审批制）
  #   browser: true     # 真实浏览器（chromedp 无头）
  #   system: true      # 定时器/后台任务管理/行为回溯

  debug: false           # true 时每个 turn 的完整请求/响应落盘到 agent/debug/
  context:               # 账号级工作上下文：finish 暂停执行，不清空；当前仅进程内保留
    max_input_tokens: 128000       # 估算输入预算，含 system/工具/图片；不是提供商的精确 tokenizer
    review_after_wakes: 8         # 有效唤醒后的复查点，不是到次数就强制清空；无行动的轮询不计
    keep_recent_messages: 12     # 至少原样保留的尾部消息数；工具调用与回执作为完整组保留
    summary_tokens: 1024         # 摘要生成额度及正文估算上限；摘要请求也计入用量，不会发到 QQ
  # 只压缩较早且模型已读的工作记录。人格/指南/工具说明不进入摘要，最新笔记/情绪/习惯原样保留。
  # 固定提示/最新状态/工具开销扣除后，工作记录占剩余预算约 75% 时复查；唤醒复查时超过 50% 也可压缩。
  # 只有预计至少释放剩余预算的 25%（最少 256 tokens）且能容纳受保护内容时才请求摘要。
  # 当前活动的触发消息、未读工具结果和近期窗口不因预算被摘要；仍超限时记错误，不发送请求。
  # 零值/缺项使用上述默认值。模型上下文较小请降低预算或关闭不需要的工具板块。
  # 以上参数修改需重启；只有 persona/guide 和笔记/情绪/chat_style.md 是请求级热更新。
  history:
    max: 40              # 首次启动工作上下文时携带的最近 QQ 历史条数（之后按增量追加）
    trim: 20             # 启动历史的块裁剪大小；工作上下文压缩由 context 控制

webui:                   # Web 控制台（概览/消息流+思考链/agent 控制/QQ 管理）
  enable: false          # agent 需同时启用；局域网/手机访问把 host 改 0.0.0.0
  host: "127.0.0.1"
  port: 6077
  token: ""              # enable 时必填：Bearer 鉴权令牌，也是管理权限，不要泄露
