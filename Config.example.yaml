bot:
  qq_number: 0            # 机器人自己的 QQ 号(agent 的 @检测与上下文都用它)
  admin_number:
    - 1234
netsetting:
  host: "172.25.240.1"    # WSL 宿主网卡地址(wsl -d Ubuntu -- hostname -I 看对端;每次 WSL 重启可能变化)
  port: 9090
  token: "填一个随机hex,需与 NapCat httpClients 的 token 一致"
  pattern: "/Q-Mi"
napcat:
  ws:
    enable: false
    host: "127.0.0.1"
    port: 8080
  http:
    enable: true
    host: "172.25.x.x"    # WSL 内 NapCat 的地址(wsl 里 ip addr show eth0)
    port: 8080
    token: "填一个随机hex,需与 NapCat httpServers 的 token 一致"
storage:
  enable: true
  path: "Q-Mi.db"
agent:
  enable: false
  base_url: "https://api.example.com/v1"   # OpenAI 兼容地址,含 /v1
  api_key: "sk-..."
  model: "deepseek-chat"
  persona_file: "agent/persona.md"
  guide_file: "agent/guide.md"   # agent 行为/格式约束(工具用法细节走 help 工具)
  # image_dir: "agent/images"    # 图片内容寻址缓存目录(sha256 落盘,按消息锚定去重,超 2GB 自动清最旧)；缺省即该路径
  debounce: 3s
  self_wake: "10m"       # 定时轮询：缺省 10 分钟一次，"off" 关闭；轮询只是唤醒 agent，发不发言由模型自己决定
  temperature: 0.8
  debug: false           # true 时每个 turn 的完整请求/响应落盘到 agent/debug/
  multimodal: true       # 模型支持图片输入时保持 true：消息里的图片以多模态内容直送模型；不支持图片的模型设 false（false 时维持纯文本+原始 CQ 码）
  max_tool_rounds: 10    # 思考轮数上限(工具调用循环,finish 提前终止)
  history:
    max: 40
    trim: 20
webui:
  enable: false          # Web 控制台(agent 需同时启用)；要手机/局域网访问把 host 改 0.0.0.0
  host: "127.0.0.1"
  port: 6077
  token: ""              # enable 时必填:Bearer 鉴权令牌,也是管理权限,不要泄露
