<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Mi 控制台</title>
<script src="/static/alpine.min.js" defer></script>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --border: #262b38;
  --text: #d7dae2; --dim: #8b91a0; --accent: #5b9dff;
  --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[x-cloak] { display: none !important; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
}
header {
  display: flex; align-items: center; gap: 24px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--panel); position: sticky; top: 0; z-index: 10;
}
.logo { font-weight: 700; font-size: 16px; color: var(--accent); }
nav { display: flex; gap: 4px; flex: 1; }
nav button {
  background: none; border: none; color: var(--dim); cursor: pointer;
  padding: 6px 14px; border-radius: 6px; font-size: 14px;
}
nav button:hover { color: var(--text); background: var(--border); }
nav button.active { color: var(--text); background: var(--border); }
main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.card .k { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
.card .v { font-size: 20px; font-weight: 600; }
.badge { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; }
.badge.ok { background: rgba(74,222,128,.15); color: var(--ok); }
.badge.bad { background: rgba(248,113,113,.15); color: var(--bad); }
/* 思考链 Kind 徽标（W2 消息流） */
.ebadge { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; margin-right: 6px; }
.ebadge.turn_start   { background: rgba(91,157,255,.18); color: var(--accent); }
.ebadge.reasoning    { background: rgba(167,139,250,.18); color: #a78bfa; }
.ebadge.output       { background: rgba(74,222,128,.18); color: var(--ok); }
.ebadge.tool_call    { background: rgba(251,191,36,.18); color: var(--warn); }
.ebadge.tool_result  { background: rgba(251,191,36,.12); color: #d3a417; }
.ebadge.reply        { background: rgba(74,222,128,.25); color: var(--ok); }
.ebadge.error        { background: rgba(248,113,113,.2); color: var(--bad); }
.ebadge.finish       { background: rgba(139,145,160,.2); color: var(--dim); }
.ebadge.interrupted  { background: rgba(248,113,113,.14); color: #fca5a5; }
.ebadge.usage        { background: rgba(139,145,160,.12); color: var(--dim); }
.ebadge.config       { background: rgba(56,189,248,.18); color: #38bdf8; }
/* 消息流布局 */
.stream { display: flex; gap: 14px; min-height: 60vh; }
.chat-list { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
.chat-item {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer;
}
.chat-item:hover { border-color: var(--accent); }
.chat-item.active { border-color: var(--accent); background: rgba(91,157,255,.08); }
.chat-item .t { font-weight: 600; font-size: 13px; }
.chat-item .s { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.stream-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.msg-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.msg-row { display: flex; }
.msg-row.sent { justify-content: flex-end; }
.bubble {
  max-width: 76%; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 7px 12px; white-space: pre-wrap; word-break: break-word;
}
.msg-row.sent .bubble { background: rgba(91,157,255,.14); border-color: rgba(91,157,255,.4); }
.msg-meta { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.msg-row.recalled .bubble { opacity: .55; border-style: dashed; }
.trace { border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  margin-bottom: 10px; padding: 8px 10px; max-height: 220px; overflow-y: auto;
  font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.trace .ev { border-bottom: 1px solid rgba(38,43,56,.5); padding-bottom: 3px; }
.trace .ev:last-child { border-bottom: none; }
.trace .m { color: var(--dim); margin-right: 6px; font-size: 11px; }
.stream-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.stream-toolbar input[type=text] {
  flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
.search-hit { cursor: pointer; }
.search-hit:hover { border-color: var(--accent); }
.load-more { align-self: center; margin: 4px 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.muted { color: var(--dim); }
.section-title { margin: 20px 0 10px; font-size: 15px; color: var(--dim); }
.placeholder {
  border: 1px dashed var(--border); border-radius: 10px;
  padding: 48px 0; text-align: center; color: var(--dim);
}
.toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
button.act {
  background: var(--border); color: var(--text); border: none;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
}
button.act:hover { filter: brightness(1.2); }
button.primary { background: var(--accent); color: #fff; }
/* token 遮罩 */
.mask {
  position: fixed; inset: 0; background: rgba(8, 10, 14, .92);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.mask .panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px; width: 360px;
}
.mask h2 { font-size: 16px; margin-bottom: 6px; }
.mask p { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
.mask input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; font-size: 14px; margin-bottom: 12px;
}
.mask .err { color: var(--bad); font-size: 13px; margin-bottom: 10px; }
/* W3 agent 控制页 */
.agent-input {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
.note-row {
  display: flex; gap: 10px; align-items: baseline;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; margin-bottom: 6px;
}
.timer-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.timer-table th, .timer-table td {
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.timer-table th { color: var(--dim); font-weight: 500; }
.file-editor {
  width: 100%; min-height: 240px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  font: 13px/1.6 Consolas, monospace; resize: vertical;
}
button.danger { color: var(--bad); }
label.danger, span.danger { color: var(--bad); }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  padding: 8px 18px; border-radius: 8px; z-index: 90;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .4); max-width: 80vw;
}
</style>
</head>
<body>
<div x-data="app()" x-init="init()">
  <header>
    <span class="logo">Q-Mi 控制台</span>
    <nav>
      <button :class="tab==='overview' && 'active'" @click="tab='overview'">概览</button>
      <button :class="tab==='stream' && 'active'" @click="tab='stream'">消息流</button>
      <button :class="tab==='agent' && 'active'" @click="tab='agent'">Agent</button>
      <button :class="tab==='qq' && 'active'" @click="tab='qq'">QQ 管理</button>
      <button :class="tab==='config' && 'active'" @click="tab='config'">配置</button>
    </nav>
  </header>

  <main>
    <!-- W1: 概览 -->
    <section x-show="tab==='overview'">
      <div class="toolbar">
        <button class="act" @click="loadOverview()">刷新</button>
      </div>
      <template x-if="ov">
        <div>
          <div class="grid">
            <div class="card">
              <div class="k">NapCat</div>
              <div class="v">
                <span class="dot" :class="ov.napcat.online ? 'ok' : 'bad'"></span>
                <span x-text="ov.napcat.online ? '在线' : '离线'"></span>
              </div>
              <div class="muted" x-text="ov.napcat.version || '未连接'"></div>
            </div>
            <div class="card">
              <div class="k">运行时长</div>
              <div class="v" x-text="fmtUptime(ov.uptime_seconds)"></div>
            </div>
            <div class="card">
              <div class="k">消息库</div>
              <div class="v" x-text="ov.messages < 0 ? '未启用' : ov.messages"></div>
              <div class="muted" x-text="'通知 ' + (ov.notices < 0 ? '未启用' : ov.notices)"></div>
            </div>
            <div class="card">
              <div class="k">情绪</div>
              <div class="v" style="font-size:16px" x-text="ov.mood || '—'"></div>
            </div>
            <div class="card">
              <div class="k">思考笔记</div>
              <div class="v" x-text="ov.notes_count"></div>
            </div>
            <div class="card">
              <div class="k">定时器</div>
              <div class="v" x-text="ov.timers_count < 0 ? '—' : ov.timers_count"></div>
            </div>
            <div class="card">
              <div class="k">缓存命中率</div>
              <div class="v" x-text="fmtHitRate(ov.usage)"></div>
              <div class="muted" x-text="'请求 ' + (ov.usage?.requests ?? 0) + ' · 输出 ' + fmtTokens(ov.usage?.output_tokens) + ' tok'"></div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="!ov && ovErr">
        <div class="placeholder" x-text="ovErr"></div>
      </template>
    </section>

    <!-- W2: 消息流 -->
    <section x-show="tab==='stream'">
      <div class="stream-toolbar">
        <input type="text" x-model="searchQ" placeholder="搜索消息关键词…"
               @keydown.enter="doSearch()">
        <button class="act primary" @click="doSearch()">搜索</button>
        <button class="act" x-show="searchMode" @click="exitSearch()">返回会话</button>
        <label style="cursor:pointer" title="轮询 /api/events 展示 agent 思考链">
          <input type="checkbox" x-model="traceOn" @change="toggleTrace()"> 实时思考链
        </label>
      </div>

      <template x-if="traceOn">
        <div class="trace" x-ref="traceBox">
          <template x-for="ev in traceEvents" :key="ev.id">
            <div class="ev">
              <span class="ebadge" :class="ev.kind" x-text="ev.kind"></span>
              <span class="m" x-text="fmtTime(ev.time)"></span>
              <span class="m" x-show="ev.chat_type || ev.chat_id"
                    x-text="ev.chat_type + ':' + ev.chat_id"></span>
              <span x-text="ev.text"></span>
            </div>
          </template>
          <div class="muted" x-show="!traceEvents.length">等待事件…（agent 产生思考链时实时滚动）</div>
        </div>
      </template>

      <template x-if="!searchMode">
        <div class="stream">
          <div class="chat-list">
            <div class="muted" x-show="chatsErr" x-text="chatsErr"></div>
            <div class="muted" x-show="!chats.length && !chatsErr">暂无会话</div>
            <template x-for="c in chats" :key="c.chat_type + ':' + c.chat_id">
              <div class="chat-item" :class="curChat && curChat.chat_type===c.chat_type && curChat.chat_id===c.chat_id && 'active'"
                   @click="openChat(c)">
                <div class="t">
                  <span x-text="chatTitle(c)"></span>
                  <span class="muted" style="font-weight:400;float:right" x-text="relTime(c.last_time)"></span>
                </div>
                <div class="s" x-text="c.last_text"></div>
              </div>
            </template>
          </div>
          <div class="stream-main">
            <div class="muted" x-show="msgsErr" x-text="msgsErr"></div>
            <div class="placeholder" x-show="!curChat && !msgsErr">← 从左侧选择会话</div>
            <div class="msg-list" x-show="curChat" x-ref="msgBox">
              <button class="act load-more" x-show="hasMore && !loadingMore" @click="loadMore()">加载更多</button>
              <div class="muted load-more" x-show="loadingMore">加载中…</div>
              <template x-for="m in msgs" :key="m.message_id">
                <div class="msg-row" :class="[m.direction === 'sent' ? 'sent' : '', m.recalled ? 'recalled' : '']">
                  <div class="bubble">
                    <div class="msg-meta">
                      <span x-text="(m.sender_name || '未知') + (m.user_id ? '(' + m.user_id + ')' : '')"></span>
                      <span style="float:right" x-text="fmtTime(m.time * 1000)"></span>
                    </div>
                    <span x-text="m.text || m.raw_message"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template x-if="searchMode">
        <div class="stream-main">
          <div class="muted" x-text="searchResults.length ? ('共 ' + searchResults.length + ' 条命中，点击跳转会话') : '无匹配结果'"></div>
          <div class="msg-list">
            <template x-for="m in searchResults" :key="m.message_id + ':' + m.chat_type + ':' + m.chat_id">
              <div class="bubble search-hit" @click="jumpToChat(m)">
                <div class="msg-meta">
                  <span x-text="chatTitle(m)"></span> ·
                  <span x-text="m.sender_name"></span> ·
                  <span x-text="fmtTime(m.time * 1000)"></span>
                </div>
                <span x-text="m.text || m.raw_message"></span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- W3: Agent 控制 -->
    <section x-show="tab==='agent'">
      <template x-if="agentDisabled">
        <div class="placeholder">
          Agent 未启用：请在 Config.yaml 设置 agent.enable: true 并重启进程。<br>
          <span class="muted">笔记/情绪/定时器/唤醒均不可用。</span>
        </div>
      </template>

      <template x-if="!agentDisabled">
        <div>
          <!-- 情绪 -->
          <div class="card">
            <div class="k">当前情绪</div>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:16px;font-weight:600" x-text="moodNow || '—'"></span>
              <input type="text" class="agent-input" style="flex:1" x-model="moodInput"
                     placeholder="设置为…" @keydown.enter="saveMood()">
              <button class="act primary" @click="saveMood()">保存</button>
            </div>
          </div>

          <!-- 思考笔记 -->
          <div class="section-title">思考笔记</div>
          <div class="muted" x-show="!notes.length">暂无笔记</div>
          <template x-for="n in notes" :key="n.index">
            <div class="note-row">
              <span class="muted" style="font-size:12px;white-space:nowrap" x-text="fmtTime(n.time * 1000)"></span>
              <span style="flex:1;word-break:break-word" x-text="n.text"></span>
              <button class="act danger" @click="delNote(n.index)">删除</button>
            </div>
          </template>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="text" class="agent-input" style="flex:1" x-model="noteInput"
                   placeholder="新增笔记内容…" @keydown.enter="addNote()">
            <button class="act primary" @click="addNote()">添加</button>
          </div>

          <!-- 定时器 -->
          <div class="section-title">定时器</div>
          <table class="timer-table" x-show="timers.length">
            <thead><tr><th>触发时间</th><th>内容</th><th>所属会话</th><th></th></tr></thead>
            <tbody>
              <template x-for="t in timers" :key="t.id">
                <tr>
                  <td x-text="fmtTime(Date.parse(t.fire_at))"></td>
                  <td x-text="t.note"></td>
                  <td x-text="timerChat(t)"></td>
                  <td><button class="act danger" @click="cancelTimer(t.id)">取消</button></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="muted" x-show="!timers.length">暂无定时器</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="number" class="agent-input" style="width:130px" x-model="timerDelay"
                   placeholder="延迟秒数" min="1" max="604800">
            <input type="text" class="agent-input" style="flex:1" x-model="timerNote"
                   placeholder="提醒内容…" @keydown.enter="addTimer()">
            <button class="act primary" @click="addTimer()">添加</button>
          </div>
          <div class="muted" style="font-size:12px;margin-top:4px">
            延迟 1..604800 秒（最长 7 天）；提醒注入 agent 自身会话，发给谁由其自决。
          </div>

          <!-- 手动唤醒 -->
          <div class="section-title">手动唤醒</div>
          <div style="display:flex;gap:8px">
            <input type="text" class="agent-input" style="flex:1" x-model="wakeText"
                   placeholder="注入给 agent 的一条消息…" @keydown.enter="doWake()">
            <button class="act primary" @click="doWake()">唤醒</button>
          </div>

          <!-- persona / guide 编辑器 -->
          <div class="section-title">提示词文件（persona / guide）</div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <select class="agent-input" style="width:190px" x-model="fileSel">
              <option value="persona">persona.md（人设）</option>
              <option value="guide">guide.md（工作方式）</option>
            </select>
            <button class="act primary" @click="saveFile()">保存</button>
            <span class="muted" style="font-size:12px">builder 构造时读取：保存后重启进程生效</span>
          </div>
          <textarea class="file-editor" x-model="fileText[fileSel]" spellcheck="false"></textarea>
        </div>
      </template>
    </section>
    <!-- W4: QQ 管理 -->
    <section x-show="tab==='qq'">
      <div class="toolbar">
        <button class="act" @click="loadQQData()">刷新</button>
      </div>
      <div class="muted" x-show="qqErr" x-text="qqErr"></div>

      <!-- 好友（本地搜索过滤） -->
      <div class="section-title">好友 <span class="muted" x-text="'（' + friends.length + '）'"></span></div>
      <input type="text" class="agent-input" style="width:300px;margin-bottom:8px"
             x-model="friendQ" placeholder="搜索昵称 / 备注 / QQ 号…">
      <template x-for="f in filteredFriends()" :key="f.user_id">
        <div class="note-row">
          <span x-text="(f.nickname || '未知') + (f.remark ? '（' + f.remark + '）' : '')"></span>
          <span class="muted" style="font-size:12px" x-text="'Lv.' + f.level" x-show="f.level"></span>
          <span class="muted" style="margin-left:auto;font-size:12px" x-text="f.user_id"></span>
        </div>
      </template>
      <div class="muted" x-show="friends.length && !filteredFriends().length">无匹配好友</div>
      <div class="muted" x-show="!friends.length && !qqErr">暂无好友数据</div>

      <!-- 群列表（点群展开成员） -->
      <div class="section-title">群列表 <span class="muted" x-text="'（' + groups.length + '）'"></span></div>
      <template x-for="g in groups" :key="g.group_id">
        <div class="chat-item" :class="curGroup && curGroup.group_id===g.group_id && 'active'"
             @click="loadMembers(g)">
          <div class="t">
            <span x-text="g.group_name || '未命名群'"></span>
            <span class="muted" style="font-weight:400;float:right" x-text="g.member_count + ' 人'"></span>
          </div>
          <div class="s" x-text="'群号 ' + g.group_id + (curGroup && curGroup.group_id===g.group_id ? ' · 点击刷新成员' : ' · 点击加载成员')"></div>
        </div>
      </template>
      <div class="muted" x-show="!groups.length && !qqErr">暂无群数据</div>

      <!-- 群成员 -->
      <template x-if="curGroup">
        <div>
          <div class="section-title">
            <span x-text="'群成员：' + (curGroup.group_name || curGroup.group_id)"></span>
            <span class="muted" x-text="memberTruncated ? '（共 ' + memberTotal + ' 人，显示前 ' + members.length + '）' : '（共 ' + memberTotal + ' 人）'"></span>
          </div>
          <template x-for="m in members" :key="m.user_id">
            <div class="note-row">
              <span class="ebadge" :class="m.role === 'owner' ? 'reply' : (m.role === 'admin' ? 'turn_start' : 'finish')"
                    x-text="m.role === 'owner' ? '群主' : (m.role === 'admin' ? '管理' : '成员')"></span>
              <span x-text="m.card || m.nickname || '未知'"></span>
              <span class="muted" style="margin-left:auto;font-size:12px" x-text="m.user_id"></span>
            </div>
          </template>
        </div>
      </template>

      <!-- NapCat 动作直调面板 -->
      <div class="section-title">NapCat 动作直调</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <select class="agent-input" style="width:300px" x-model="napAction" @change="onNapActionChange()">
          <template x-for="a in napActions" :key="a">
            <option :value="a" x-text="a + (napDangerous[a] ? ' ⚠' : '')"></option>
          </template>
        </select>
        <label style="cursor:pointer" :class="isDangerous() ? 'danger' : ''">
          <input type="checkbox" x-model="napConfirm"> 确认执行（危险操作必勾）
        </label>
        <button class="act primary" :disabled="napBusy" @click="runNapcat()" x-text="napBusy ? '执行中…' : '执行'"></button>
      </div>
      <textarea class="file-editor" style="min-height:110px" x-model="napParams"
                spellcheck="false" placeholder='参数 JSON 对象，如 {"group_id":123}'></textarea>
      <template x-if="napResult">
        <pre class="file-editor" style="min-height:80px;margin-top:8px" x-text="napResult"></pre>
      </template>
      <div class="muted" style="font-size:12px;margin-top:4px">
        危险动作（踢人/退群/删好友/改资料/改群名）需勾选确认，confirm 由服务端剥离后转发。
      </div>
    </section>
    <!-- 配置 -->
    <section x-show="tab==='config'">
      <div class="toolbar">
        <button class="act" @click="loadConfig()">刷新</button>
        <button class="act" @click="reloadConfig()">重读文件</button>
        <span class="muted" x-text="cfgPaths"></span>
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">
        保存会写入 Config.webui.yaml 并立即生效（覆盖 Config.yaml 的同名键）。
        监听地址 / 存储路径 / WebUI 端口 / bot.qq_number / agent.enable 等需重启，WebUI 不允许修改。
      </div>
      <div class="muted" x-show="cfgErr" style="color:var(--bad)" x-text="cfgErr"></div>

      <div class="section-title">模型档位</div>
      <template x-if="!cfgTiers.length">
        <div class="muted">尚未配置 models，当前使用顶层单模型（base_url / api_key / model）。点「+ 档位」后加候选即可分档。</div>
      </template>
      <template x-for="(tier, ti) in cfgTiers" :key="tier.name">
        <div class="card">
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <b x-text="tier.name"></b>
            <label class="muted"><input type="checkbox" x-model="tier.enable"> 启用</label>
            <label class="muted">策略
              <select class="agent-input" x-model="tier.strategy" style="width:auto">
                <option value="priority">priority</option>
              </select>
            </label>
            <button class="act" @click="addCandidate(ti)">+ 候选</button>
          </div>
          <table class="timer-table" style="margin-top:8px">
            <thead><tr><th>启用</th><th>名称</th><th>模型</th><th>base_url</th><th>api_key</th><th>能力</th><th></th></tr></thead>
            <tbody>
              <template x-for="(c, ci) in tier.candidates" :key="ci">
                <tr>
                  <td><input type="checkbox" x-model="c.enable"></td>
                  <td><input class="agent-input" style="width:110px" x-model="c.name"></td>
                  <td><input class="agent-input" style="width:140px" x-model="c.model"></td>
                  <td><input class="agent-input" style="width:200px" x-model="c.base_url" placeholder="留空=用顶层"></td>
                  <td><input class="agent-input" style="width:150px" x-model="c.api_key" placeholder="掩码=不修改"></td>
                  <td><input class="agent-input" style="width:120px" x-model="c.capabilities" placeholder="tools,vision"></td>
                  <td style="white-space:nowrap">
                    <button class="act" @click="testModel(tier.name, c.name)">测试</button>
                    <button class="act danger" @click="removeCandidate(ti, ci)">删除</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="muted" style="font-size:12px;margin-top:4px">测试走已保存的配置：改完先保存再测。</div>
        </div>
      </template>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
        <button class="act" @click="addTier()">+ 档位</button>
        <button class="act primary" @click="saveModels()">保存模型配置</button>
        <span class="muted" x-text="cfgMsg"></span>
      </div>

      <div class="section-title">行为参数</div>
      <div class="grid">
        <label class="muted">temperature<input class="agent-input" x-model.number="cfgParams.temperature"></label>
        <label class="muted">max_tool_rounds<input class="agent-input" x-model.number="cfgParams.max_tool_rounds"></label>
        <label class="muted">debounce（秒）<input class="agent-input" x-model.number="cfgParams.debounce_seconds"></label>
        <label class="muted">self_wake<input class="agent-input" x-model="cfgParams.self_wake" placeholder="10m / off"></label>
        <label class="muted">max_attempts<input class="agent-input" x-model.number="cfgParams.max_attempts"></label>
        <label class="muted">context.max_input_tokens<input class="agent-input" x-model.number="cfgParams.context.max_input_tokens"></label>
        <label class="muted">context.review_after_wakes<input class="agent-input" x-model.number="cfgParams.context.review_after_wakes"></label>
        <label class="muted">context.keep_recent_messages<input class="agent-input" x-model.number="cfgParams.context.keep_recent_messages"></label>
        <label class="muted">context.summary_tokens<input class="agent-input" x-model.number="cfgParams.context.summary_tokens"></label>
      </div>
      <button class="act primary" style="margin-top:8px" @click="saveParams()">保存行为参数</button>

      <div class="section-title">工具板块</div>
      <div class="grid">
        <template x-for="m in cfgModuleNames" :key="m">
          <label class="muted"><input type="checkbox" x-model="cfgModules[m]"> <span x-text="m"></span></label>
        </template>
      </div>
      <button class="act primary" style="margin-top:8px" @click="saveModules()">保存板块开关</button>

      <div class="section-title">需重启（只读）</div>
      <pre class="file-editor" style="min-height:90px" x-text="cfgRestartText"></pre>
    </section>
  </main>

  <!-- 操作提示 toast -->
  <div class="toast" x-cloak x-show="toastMsg" x-text="toastMsg"></div>

  <!-- token 输入遮罩 -->
  <template x-if="needToken">
    <div class="mask">
      <div class="panel">
        <h2>访问令牌</h2>
        <p>输入 Config.yaml 中 webui.token 的值，将保存在浏览器 localStorage。</p>
        <div class="err" x-show="authErr" x-text="authErr"></div>
        <input type="password" x-model="tokenInput" placeholder="访问令牌"
               @keydown.enter="saveToken()">
        <button class="act primary" @click="saveToken()">进入控制台</button>
      </div>
    </div>
  </template>
</div>

<script>
function app() {
  return {
    tab: 'overview',
    ov: null, ovErr: '',
    needToken: false, authErr: '',
    tokenInput: '',
    timer: null,
    // W2 消息流状态
    chats: [], chatsErr: '', chatsLoaded: false,
    curChat: null, msgs: [], msgsErr: '',
    hasMore: false, loadingMore: false,
    searchQ: '', searchMode: false, searchResults: [],
    traceOn: false, traceEvents: [], traceLastID: 0, traceTimer: null,
    // W3 agent 控制
    moodNow: '', moodInput: '',
    notes: [], noteInput: '',
    timers: [], timerDelay: '', timerNote: '',
    wakeText: '',
    agentDisabled: false,
    fileSel: 'persona', fileText: { persona: '', guide: '' },
    // W4 QQ 管理
    friends: [], friendQ: '', groups: [], curGroup: null,
    members: [], memberTotal: 0, memberTruncated: false, qqErr: '',
    napActions: [], napDangerous: {}, napAction: '', napParams: '{}',
    napConfirm: false, napResult: '', napBusy: false,
    // 配置页
    cfg: null, cfgErr: '', cfgMsg: '', cfgPaths: '', cfgRestartText: '',
    cfgTiers: [], cfgParams: { context: {} }, cfgModules: {},
    cfgModuleNames: ['core', 'memory', 'sticker', 'qzone', 'admin', 'computer', 'browser', 'system'],
    toastMsg: '', toastTimer: null,
    init() {
      if (!localStorage.qmi_token) {
        this.needToken = true;
        return;
      }
      this.loadOverview();
      // 概览 5s 轮询；消息流 1.5s 轮询 /api/events 由"实时思考链"开关控制
      this.timer = setInterval(() => { if (!this.needToken) this.loadOverview(); }, 5000);
      this.$watch('tab', (t) => {
        if (t === 'stream' && !this.chatsLoaded) this.loadChats();
        if (t === 'agent') this.loadAgentData();
        if (t === 'qq') this.loadQQData();
        if (t === 'config') this.loadConfig();
      });
    },
    async api(path, opts = {}) {
      const headers = Object.assign(
        { 'Authorization': 'Bearer ' + localStorage.qmi_token }, opts.headers || {});
      const r = await fetch(path, Object.assign({}, opts, { headers }));
      if (r.status === 401) {
        this.needToken = true;
        throw new Error('unauthorized');
      }
      return r;
    },
    async loadOverview() {
      try {
        const r = await this.api('/api/overview');
        this.ov = await r.json();
        this.ovErr = '';
      } catch (e) {
        if (this.needToken) this.authErr = '';
        else this.ovErr = '加载失败：' + e.message;
      }
    },
    saveToken() {
      if (!this.tokenInput.trim()) { this.authErr = '请输入令牌'; return; }
      localStorage.qmi_token = this.tokenInput.trim();
      this.tokenInput = '';
      this.authErr = '';
      this.needToken = false;
      this.loadOverview();
    },
    fmtUptime(sec) {
      if (sec == null) return '—';
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
            m = Math.floor(sec % 3600 / 60);
      if (d > 0) return d + ' 天 ' + h + ' 小时';
      if (h > 0) return h + ' 小时 ' + m + ' 分';
      return m + ' 分 ' + Math.floor(sec % 60) + ' 秒';
    },
    // ---- LLM 用量 ----
    fmtHitRate(u) {
      if (!u || (u.cache_hit_tokens + u.cache_miss_tokens) === 0) return '—';
      return Math.round(u.cache_hit_tokens / (u.cache_hit_tokens + u.cache_miss_tokens) * 100) + '%';
    },
    fmtTokens(n) {
      if (n == null) return '—';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    },
    // ---- W2 消息流 ----
    chatTitle(c) {
      return (c.chat_type === 'group' ? '群:' : '私聊:') + c.chat_id;
    },
    fmtTime(ms) {
      if (!ms) return '';
      const d = new Date(ms);
      const p = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
        ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    },
    relTime(sec) {
      if (!sec) return '';
      const diff = Date.now() / 1000 - sec;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
      return this.fmtTime(sec * 1000).slice(0, 10);
    },
    async loadChats() {
      try {
        const r = await this.api('/api/chats');
        this.chats = await r.json();
        this.chatsErr = '';
        this.chatsLoaded = true;
      } catch (e) {
        if (!this.needToken) this.chatsErr = '会话列表加载失败：' + e.message;
      }
    },
    openChat(c) {
      this.curChat = c;
      this.searchMode = false;
      this.msgs = [];
      this.hasMore = false;
      this.loadMessages();
    },
    async loadMessages(beforeTime) {
      if (!this.curChat) return;
      const c = this.curChat;
      let url = '/api/messages?chat_type=' + encodeURIComponent(c.chat_type) +
        '&chat_id=' + encodeURIComponent(c.chat_id);
      if (beforeTime) url += '&before_time=' + encodeURIComponent(beforeTime);
      try {
        const r = await this.api(url);
        const rows = await r.json();
        if (this.curChat !== c) return; // 期间切换了会话
        this.msgsErr = '';
        const asc = rows.slice().reverse(); // API 新→旧，展示按时间正序
        if (beforeTime) this.msgs = asc.concat(this.msgs);
        else this.msgs = asc;
        this.hasMore = rows.length >= 50;
        this.$nextTick(() => { this.scrollBottom(this.$refs.msgBox); });
      } catch (e) {
        if (!this.needToken) this.msgsErr = '消息加载失败：' + e.message;
      }
    },
    loadMore() {
      if (!this.msgs.length || this.loadingMore) return;
      this.loadingMore = true;
      // 游标 = 已加载最旧一条的 time（不包含该条）
      this.loadMessages(this.msgs[0].time).finally(() => { this.loadingMore = false; });
    },
    async doSearch() {
      const q = this.searchQ.trim();
      if (!q) return;
      try {
        const r = await this.api('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        this.searchResults = await r.json();
        this.searchMode = true;
      } catch (e) {
        if (!this.needToken) this.msgsErr = '搜索失败：' + e.message;
      }
    },
    exitSearch() {
      this.searchMode = false;
      this.searchResults = [];
    },
    jumpToChat(m) {
      this.openChat({ chat_type: m.chat_type, chat_id: m.chat_id });
    },
    // ---- 实时思考链（1.5s 轮询 /api/events） ----
    toggleTrace() {
      if (this.traceOn) {
        this.pollEvents();
        this.traceTimer = setInterval(() => this.pollEvents(), 1500);
      } else if (this.traceTimer) {
        clearInterval(this.traceTimer);
        this.traceTimer = null;
      }
    },
    async pollEvents() {
      try {
        const r = await this.api('/api/events?after=' + this.traceLastID);
        const events = await r.json();
        if (!events.length) return;
        this.traceEvents.push(...events);
        this.traceLastID = events[events.length - 1].id;
        // 环形缓冲防涨爆：只保留最近 300 条展示
        if (this.traceEvents.length > 300) this.traceEvents = this.traceEvents.slice(-300);
        this.$nextTick(() => { this.scrollBottom(this.$refs.traceBox); });
      } catch (e) { /* 轮询失败静默，下一轮重试 */ }
    },
    scrollBottom(el) {
      if (el) el.scrollTop = el.scrollHeight;
    },
    // ---- W3 agent 控制 ----
    agentToast(msg) {
      this.toastMsg = msg;
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => { this.toastMsg = ''; }, 3000);
    },
    // agentAPI 带 JSON 头的写操作封装：503（agent 未启用）置 agentDisabled
    // 显示友好提示，其余非 2xx 抛出响应体里的错误文本。
    async agentAPI(path, opts = {}) {
      const r = await this.api(path, Object.assign({
        headers: { 'Content-Type': 'application/json' },
      }, opts));
      const text = (await r.text()).trim();
      if (r.status === 503) {
        this.agentDisabled = true;
        throw new Error(text || 'agent 未启用');
      }
      if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
      return r;
    },
    async loadAgentData() {
      this.agentDisabled = false;
      try {
        const [m, n, t] = await Promise.all([
          this.api('/api/mood'), this.api('/api/notes'), this.api('/api/timers'),
        ]);
        this.moodNow = (await m.json()).mood || '';
        this.notes = await n.json();
        this.timers = await t.json();
      } catch (e) {
        if (!this.needToken) this.agentToast('加载失败：' + e.message);
        return;
      }
      for (const name of ['persona', 'guide']) {
        try {
          const r = await this.api('/api/file?name=' + name);
          this.fileText[name] = (await r.json()).content || '';
        } catch (e) { /* 文件读失败静默，编辑器留空 */ }
      }
    },
    async saveMood() {
      try {
        await this.agentAPI('/api/mood', { method: 'POST', body: JSON.stringify({ mood: this.moodInput }) });
        this.moodNow = this.moodInput;
        this.moodInput = '';
        this.agentToast('情绪已保存');
      } catch (e) { if (!this.needToken) this.agentToast('保存失败：' + e.message); }
    },
    async addNote() {
      const text = this.noteInput.trim();
      if (!text) { this.agentToast('请输入笔记内容'); return; }
      try {
        await this.agentAPI('/api/notes', { method: 'POST', body: JSON.stringify({ text }) });
        this.noteInput = '';
        await this.loadNotes(); // 重新拉取拿到正确下标
      } catch (e) { if (!this.needToken) this.agentToast('添加失败：' + e.message); }
    },
    async loadNotes() {
      try { this.notes = await (await this.api('/api/notes')).json(); } catch (e) { /* 静默 */ }
    },
    async delNote(index) {
      try {
        await this.agentAPI('/api/notes/' + encodeURIComponent(index), { method: 'DELETE' });
        await this.loadNotes();
      } catch (e) { if (!this.needToken) this.agentToast('删除失败：' + e.message); }
    },
    async loadTimers() {
      try { this.timers = await (await this.api('/api/timers')).json(); } catch (e) { /* 静默 */ }
    },
    timerChat(t) {
      return (t.chat_type === 'group' ? '群:' : '私聊:') + t.chat_id;
    },
    async addTimer() {
      const d = parseInt(this.timerDelay, 10);
      if (!d || d < 1 || d > 604800) { this.agentToast('延迟需为 1..604800 秒'); return; }
      try {
        await this.agentAPI('/api/timers', {
          method: 'POST',
          body: JSON.stringify({ delay_seconds: d, note: this.timerNote }),
        });
        this.timerDelay = '';
        this.timerNote = '';
        await this.loadTimers();
        this.agentToast('定时器已添加');
      } catch (e) { if (!this.needToken) this.agentToast('添加失败：' + e.message); }
    },
    async cancelTimer(id) {
      try {
        await this.agentAPI('/api/timers/' + encodeURIComponent(id), { method: 'DELETE' });
        await this.loadTimers();
      } catch (e) { if (!this.needToken) this.agentToast('取消失败：' + e.message); }
    },
    async doWake() {
      const text = this.wakeText.trim();
      if (!text) { this.agentToast('请输入唤醒内容'); return; }
      try {
        await this.agentAPI('/api/wake', { method: 'POST', body: JSON.stringify({ text }) });
        this.wakeText = '';
        this.agentToast('已唤醒，agent 正在思考');
      } catch (e) { if (!this.needToken) this.agentToast('唤醒失败：' + e.message); }
    },
    async saveFile() {
      try {
        await this.agentAPI('/api/file', {
          method: 'PUT',
          body: JSON.stringify({ name: this.fileSel, content: this.fileText[this.fileSel] }),
        });
        this.agentToast('已保存，重启进程后生效');
      } catch (e) { if (!this.needToken) this.agentToast('保存失败：' + e.message); }
    },
    // ---- W4 QQ 管理 ----
    isDangerous() { return !!this.napDangerous[this.napAction]; },
    filteredFriends() {
      const q = this.friendQ.trim().toLowerCase();
      if (!q) return this.friends;
      return this.friends.filter(f =>
        (f.nickname || '').toLowerCase().includes(q) ||
        (f.remark || '').toLowerCase().includes(q) ||
        String(f.user_id).includes(q));
    },
    async loadQQData() {
      this.qqErr = '';
      try {
        const [f, g, n] = await Promise.all([
          this.api('/api/friends'), this.api('/api/groups'), this.api('/api/napcat'),
        ]);
        this.friends = await f.json();
        this.groups = await g.json();
        const nl = await n.json();
        this.napActions = nl.actions || [];
        this.napDangerous = {};
        for (const a of (nl.dangerous || [])) this.napDangerous[a] = true;
        if (!this.napAction && this.napActions.length) this.napAction = this.napActions[0];
        this.onNapActionChange();
      } catch (e) {
        if (!this.needToken) this.qqErr = 'QQ 数据加载失败：' + e.message;
      }
    },
    onNapActionChange() {
      // 切到危险动作自动勾上确认（红字提示），切走恢复默认不勾
      this.napConfirm = this.isDangerous();
    },
    async loadMembers(g) {
      this.curGroup = g;
      try {
        const r = await this.api('/api/members?group_id=' + encodeURIComponent(g.group_id));
        const d = await r.json();
        if (this.curGroup !== g) return; // 期间切换了群
        this.members = d.members || [];
        this.memberTotal = d.total || 0;
        this.memberTruncated = !!d.truncated;
      } catch (e) {
        if (!this.needToken) this.qqErr = '群成员加载失败：' + e.message;
      }
    },
    async runNapcat() {
      if (!this.napAction) { this.agentToast('请选择动作'); return; }
      let params = {};
      const raw = this.napParams.trim();
      if (raw) {
        try { params = JSON.parse(raw); } catch (e) { this.agentToast('参数不是合法 JSON：' + e.message); return; }
        if (params === null || typeof params !== 'object' || Array.isArray(params)) {
          this.agentToast('参数应为 JSON 对象'); return;
        }
      }
      if (this.isDangerous()) {
        if (!this.napConfirm) { this.agentToast('危险操作需勾选「确认执行」'); return; }
        params.confirm = true; // 服务端校验后剥离，不透传给 NapCat
      }
      this.napBusy = true;
      try {
        const r = await this.api('/api/napcat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: this.napAction, params }),
        });
        const text = (await r.text()).trim();
        if (!r.ok) {
          let msg = text;
          try { msg = JSON.parse(text).error || text; } catch (e) { /* 纯文本错误体 */ }
          this.napResult = '执行失败（HTTP ' + r.status + '）：' + msg;
          return;
        }
        try { this.napResult = JSON.stringify(JSON.parse(text), null, 2); }
        catch (e) { this.napResult = text; }
      } catch (e) {
        if (!this.needToken) this.agentToast('请求失败：' + e.message);
      } finally {
        this.napBusy = false;
      }
    },
    // ---- 配置页 ----
    async loadConfig() {
      try {
        const r = await this.api('/api/config');
        const text = await r.text();
        if (!r.ok) { this.cfgErr = '加载失败：' + text.trim(); return; }
        const v = JSON.parse(text);
        this.cfg = v; this.cfgErr = ''; this.cfgMsg = '';
        this.cfgPaths = v.paths.base + '  +  ' + v.paths.overlay;
        const a = (v.effective && v.effective.agent) || {};
        const models = a.models || {};
        this.cfgTiers = Object.keys(models).map(name => {
          const t = models[name] || {};
          const cands = t.candidates || [];
          return {
            name,
            enable: t.enable !== false,
            strategy: t.strategy || 'priority',
            candidates: cands.map(c => ({
              name: c.name || '', model: c.model || '', base_url: c.base_url || '',
              api_key: c.api_key || '', api_key_env: c.api_key_env || '',
              enable: c.enable !== false,
              capabilities: (c.capabilities || []).join(','),
              cooldown: c.cooldown || '',
            })),
          };
        });
        this.cfgParams = {
          temperature: a.temperature === undefined ? 0.8 : a.temperature,
          max_tool_rounds: a.max_tool_rounds || 0,
          debounce_seconds: Math.round((a.debounce || 0) / 1e9),
          self_wake: a.self_wake || '',
          max_attempts: a.max_attempts || 0,
          context: Object.assign(
            { max_input_tokens: 32000, review_after_wakes: 8, keep_recent_messages: 12, summary_tokens: 1024 },
            a.context || {}),
        };
        const mods = a.modules || {};
        const m = {};
        this.cfgModuleNames.forEach(k => { m[k] = mods[k] !== false; });
        this.cfgModules = m;
        const net = v.effective.netsetting || {}, st = v.effective.storage || {};
        const wu = v.effective.webui || {}, b = v.effective.bot || {};
        this.cfgRestartText =
          'netsetting: ' + (net.host || '') + ':' + (net.port || 0) + '  pattern=' + (net.pattern || '') + '\n' +
          'storage: enable=' + !!st.enable + '  path=' + (st.path || '') + '\n' +
          'webui: ' + (wu.host || '') + ':' + (wu.port || 0) + '\n' +
          'bot.qq_number: ' + (b.qq_number || 0) + '\n' +
          'agent.enable: ' + !!a.enable;
      } catch (e) {
        if (!this.needToken) this.cfgErr = '加载失败：' + e.message;
      }
    },
    async putConfig(patch, okMsg) {
      this.cfgMsg = ''; this.cfgErr = '';
      try {
        const r = await this.api('/api/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const text = await r.text();
        if (!r.ok) { this.cfgErr = text.trim(); return false; }
        await this.loadConfig();
        this.cfgMsg = okMsg;
        return true;
      } catch (e) {
        if (!this.needToken) this.cfgErr = '保存失败：' + e.message;
        return false;
      }
    },
    buildModels() {
      const out = {};
      this.cfgTiers.forEach(t => {
        const cands = t.candidates.filter(c => c.name && c.model).map(c => {
          const o = { name: c.name, model: c.model };
          if (c.base_url) o.base_url = c.base_url;
          if (c.api_key) o.api_key = c.api_key;
          if (c.api_key_env) o.api_key_env = c.api_key_env;
          if (c.enable === false) o.enable = false;
          if (c.cooldown) o.cooldown = c.cooldown;
          if (c.capabilities && c.capabilities.trim()) {
            o.capabilities = c.capabilities.split(',').map(x => x.trim()).filter(Boolean);
          }
          return o;
        });
        out[t.name] = { enable: t.enable !== false, strategy: t.strategy || 'priority', candidates: cands };
      });
      return out;
    },
    async saveModels() {
      await this.putConfig(
        { agent: { models: this.buildModels(), max_attempts: this.cfgParams.max_attempts || 0 } },
        '模型配置已保存');
    },
    addCandidate(ti) {
      this.cfgTiers[ti].candidates.push({
        name: '', model: '', base_url: '', api_key: '', api_key_env: '',
        enable: true, capabilities: 'tools,vision', cooldown: '',
      });
    },
    removeCandidate(ti, ci) { this.cfgTiers[ti].candidates.splice(ci, 1); },
    addTier() {
      const name = prompt('新档位名（如 cheap）');
      if (!name) return;
      if (this.cfgTiers.some(t => t.name === name)) { this.agentToast('档位已存在'); return; }
      this.cfgTiers.push({ name, enable: true, strategy: 'priority', candidates: [] });
    },
    async saveParams() {
      const p = this.cfgParams;
      await this.putConfig({ agent: {
        temperature: p.temperature,
        max_tool_rounds: p.max_tool_rounds,
        debounce: Math.max(1, Math.round(p.debounce_seconds)) + 's',
        self_wake: p.self_wake,
        max_attempts: p.max_attempts || 0,
        context: {
          max_input_tokens: p.context.max_input_tokens,
          review_after_wakes: p.context.review_after_wakes,
          keep_recent_messages: p.context.keep_recent_messages,
          summary_tokens: p.context.summary_tokens,
        },
      } }, '行为参数已保存');
    },
    async saveModules() {
      await this.putConfig({ agent: { modules: Object.assign({}, this.cfgModules) } }, '板块开关已保存');
    },
    async reloadConfig() {
      try {
        const r = await this.api('/api/config/reload', { method: 'POST' });
        const text = await r.text();
        if (!r.ok) { this.cfgErr = text.trim(); return; }
        await this.loadConfig();
        this.cfgMsg = '已重读配置文件';
      } catch (e) {
        if (!this.needToken) this.cfgErr = '重载失败：' + e.message;
      }
    },
    async testModel(tier, name) {
      if (!name) { this.agentToast('先给候选起名并保存'); return; }
      this.cfgMsg = '测试 ' + name + ' …';
      try {
        const r = await this.api('/api/models/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tier, name }),
        });
        const text = await r.text();
        let out = {};
        try { out = JSON.parse(text); } catch (e) { /* 纯文本错误 */ }
        if (!r.ok) { this.cfgMsg = '测试失败：' + (out.error || text.trim()); return; }
        this.cfgMsg = out.ok
          ? '✓ ' + name + ' 可用（' + out.latency_ms + 'ms）'
          : '✗ ' + name + '：' + (out.error || '不可用');
      } catch (e) {
        if (!this.needToken) this.cfgMsg = '测试失败：' + e.message;
      }
    },
  };
}
</script>
</body>
